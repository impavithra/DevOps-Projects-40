trigger:
  branches:
    include:
      - master

pr: none


# ============================================================
# SELF-HOSTED WINDOWS AGENT
# ============================================================

pool:
  name: 'Pv-agent'


# ============================================================
# VARIABLES
# ============================================================

variables:

  # Java
  javaVersion: '21'

  # Application
  appDirectory: 'DevOps-Project-01\Java-Login-App'

  # Azure Storage
  storageAccount: 'pvstrg199'
  containerName: 'pv-container'

  # Artifact
  artifactName: 'java-login-app'

  # Azure service connection
  azureServiceConnection: 'b13'


# ============================================================
# STAGES
# ============================================================

stages:


# ============================================================
# STAGE 1 - BUILD
# ============================================================

- stage: Build
  displayName: 'Build Java Login Application'

  jobs:

  - job: MavenBuild
    displayName: 'Maven Build'

    steps:

    # --------------------------------------------------------
    # CHECKOUT
    # --------------------------------------------------------

    - checkout: self
      displayName: 'Checkout source code'


    # --------------------------------------------------------
    # VERIFY AGENT
    # --------------------------------------------------------

    - powershell: |

        Write-Host "========================================"
        Write-Host "AGENT INFORMATION"
        Write-Host "========================================"

        Write-Host "Agent Name    : $env:AGENT_NAME"
        Write-Host "Agent OS      : $env:AGENT_OS"
        Write-Host "Agent Version : $env:AGENT_VERSION"
        Write-Host "Computer      : $env:COMPUTERNAME"
        Write-Host "User          : $env:USERNAME"

      displayName: 'Verify Windows Agent'


    # --------------------------------------------------------
    # VERIFY JAVA
    # --------------------------------------------------------

    - powershell: |

        Write-Host "========================================"
        Write-Host "JAVA VERSION"
        Write-Host "========================================"

        java -version

        if ($LASTEXITCODE -ne 0) {
            Write-Error "Java is not available."
            exit 1
        }

        Write-Host ""
        Write-Host "JAVA_HOME:"
        Write-Host $env:JAVA_HOME

      displayName: 'Verify Java'


    # --------------------------------------------------------
    # VERIFY MAVEN
    # --------------------------------------------------------

    - powershell: |

        Write-Host "========================================"
        Write-Host "MAVEN VERSION"
        Write-Host "========================================"

        where.exe mvn

        Write-Host ""

        mvn -version

        if ($LASTEXITCODE -ne 0) {
            Write-Error "Maven is not available to the Azure DevOps agent."
            exit 1
        }

      displayName: 'Verify Maven'


    # --------------------------------------------------------
    # VERIFY APPLICATION DIRECTORY
    # --------------------------------------------------------

        - bash: |
        echo "========================================"
        echo "VERIFY APPLICATION"
        echo "========================================"

        APP_PATH="$(Build.SourcesDirectory)/$(appDirectory)"

        echo "Application path:"
        echo "$APP_PATH"

        if [ ! -d "$APP_PATH" ]; then
          echo "ERROR: Application directory does not exist."

          echo ""
          echo "Repository contents:"
          find "$(Build.SourcesDirectory)" -type d

          exit 1
        fi

        echo ""
        echo "Application directory exists."

        echo ""
        echo "Application contents:"
        ls -la "$APP_PATH"

        echo ""
        echo "Checking pom.xml:"

        if [ ! -f "$APP_PATH/pom.xml" ]; then
          echo "ERROR: pom.xml not found."
          exit 1
        fi

        echo "pom.xml found successfully."

      displayName: 'Verify Application'
