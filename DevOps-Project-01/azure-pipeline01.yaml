trigger:
  branches:
    include:
      - master

pr: none

# ============================================================
# SELF-HOSTED MAC AGENT
# ============================================================

pool:
  name: 'Pv-agent'


# ============================================================
# VARIABLES
# ============================================================

variables:

  # Application
  appDirectory: 'DevOps-Project-01/Java-Login-App'

  # Azure Storage
  storageAccount: 'pvstrg199'
  containerName: 'pv-container'

  # Artifact
  artifactName: 'java-login-app'

  # Azure Service Connection
  azureServiceConnection: 'b13'


# ============================================================
# STAGES
# ============================================================

stages:

# ============================================================
# STAGE 1 - BUILD
# ============================================================

- stage: Build
  displayName: 'Build Java Login Application'

  jobs:

  - job: MavenBuild
    displayName: 'Maven Build'

    steps:

    # --------------------------------------------------------
    # CHECKOUT
    # --------------------------------------------------------

    - checkout: self
      displayName: 'Checkout Source Code'


    # --------------------------------------------------------
    # VERIFY AGENT
    # --------------------------------------------------------

    - bash: |
        echo "========================================"
        echo "AGENT INFORMATION"
        echo "========================================"

        echo "Agent Name    : $AGENT_NAME"
        echo "Agent OS      : $AGENT_OS"
        echo "Agent Version : $AGENT_VERSION"
        echo "Computer      : $(hostname)"
        echo "User          : $(whoami)"

      displayName: 'Verify Mac Agent'


    # --------------------------------------------------------
    # VERIFY JAVA
    # --------------------------------------------------------

    - bash: |
        set -e

        echo "========================================"
        echo "JAVA VERSION"
        echo "========================================"

        java -version

        echo ""
        echo "JAVA_HOME:"
        echo "$JAVA_HOME"

      displayName: 'Verify Java'


    # --------------------------------------------------------
    # VERIFY MAVEN
    # --------------------------------------------------------

    - bash: |
        set -e

        echo "========================================"
        echo "MAVEN VERSION"
        echo "========================================"

        which mvn

        echo ""

        mvn -version

      displayName: 'Verify Maven'


    # --------------------------------------------------------
    # VERIFY APPLICATION
    # --------------------------------------------------------

    - bash: |
        set -e

        echo "========================================"
        echo "VERIFY APPLICATION"
        echo "========================================"

        APP_PATH="$(Build.SourcesDirectory)/$(appDirectory)"

        echo "Application path:"
        echo "$APP_PATH"

        if [ ! -d "$APP_PATH" ]; then

          echo "ERROR: Application directory does not exist."

          echo ""
          echo "Repository directories:"

          find "$(Build.SourcesDirectory)" \
            -maxdepth 3 \
            -type d

          exit 1

        fi

        echo ""
        echo "Application directory exists."

        ls -la "$APP_PATH"

        echo ""
        echo "Checking pom.xml..."

        if [ ! -f "$APP_PATH/pom.xml" ]; then
          echo "ERROR: pom.xml not found."
          exit 1
        fi

        echo "pom.xml found successfully."

      displayName: 'Verify Application'


    # --------------------------------------------------------
    # MAVEN BUILD
    # --------------------------------------------------------

    - bash: |
        set -e

        echo "========================================"
        echo "MAVEN BUILD"
        echo "========================================"

        cd "$(Build.SourcesDirectory)/$(appDirectory)"

        echo "Current directory:"
        pwd

        echo ""
        echo "Running Maven build..."

        mvn clean package -DskipTests

        echo ""
        echo "Maven build completed successfully."

      displayName: 'Maven Clean Package'


    # --------------------------------------------------------
    # VERIFY BUILD OUTPUT
    # --------------------------------------------------------

    - bash: |
        set -e

        echo "========================================"
        echo "VERIFY BUILD OUTPUT"
        echo "========================================"

        cd "$(Build.SourcesDirectory)/$(appDirectory)"

        if [ ! -d "target" ]; then
          echo "ERROR: target directory not found."
          exit 1
        fi

        echo "Target directory:"
        ls -lah target

        echo ""
        echo "Generated JAR/WAR files:"

        find target \
          -maxdepth 1 \
          \( -name "*.jar" -o -name "*.war" \) \
          -type f \
          -print

      displayName: 'Verify Build Output'


    # --------------------------------------------------------
    # PREPARE ARTIFACT
    # --------------------------------------------------------

    - bash: |
        set -e

        echo "========================================"
        echo "PREPARE ARTIFACT"
        echo "========================================"

        ARTIFACT_DIR="$(Build.ArtifactStagingDirectory)/$(artifactName)"

        mkdir -p "$ARTIFACT_DIR"

        cd "$(Build.SourcesDirectory)/$(appDirectory)"

        FILE_COUNT=$(find target \
          -maxdepth 1 \
          \( -name "*.jar" -o -name "*.war" \) \
          -type f | wc -l | tr -d ' ')

        echo "Artifacts found: $FILE_COUNT"

        if [ "$FILE_COUNT" -eq 0 ]; then
          echo "ERROR: No JAR/WAR artifact was generated."
          exit 1
        fi

        find target \
          -maxdepth 1 \
          \( -name "*.jar" -o -name "*.war" \) \
          -type f \
          -exec cp {} "$ARTIFACT_DIR/" \;

        echo ""
        echo "Artifacts prepared:"

        ls -lah "$ARTIFACT_DIR"

      displayName: 'Prepare Artifact'


    # --------------------------------------------------------
    # PUBLISH PIPELINE ARTIFACT
    # --------------------------------------------------------

    - task: PublishPipelineArtifact@1
      displayName: 'Publish Pipeline Artifact'

      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/$(artifactName)'
        artifact: '$(artifactName)'


    # --------------------------------------------------------
    # VERIFY AZURE CLI
    # --------------------------------------------------------

    - bash: |
        set -e

        echo "========================================"
        echo "AZURE CLI VERSION"
        echo "========================================"

        az --version

      displayName: 'Verify Azure CLI'


    # --------------------------------------------------------
    # UPLOAD TO AZURE STORAGE
    # --------------------------------------------------------

    - task: AzureCLI@2
      displayName: 'Upload Artifact to Azure Storage'

      inputs:

        azureSubscription: '$(azureServiceConnection)'

        scriptType: 'bash'

        scriptLocation: 'inlineScript'

        inlineScript: |
          set -e

          echo "========================================"
          echo "UPLOAD TO AZURE STORAGE"
          echo "========================================"

          echo "Storage Account : $(storageAccount)"
          echo "Container       : $(containerName)"

          echo ""
          echo "Files to upload:"

          ls -lah "$(Build.ArtifactStagingDirectory)/$(artifactName)"

          echo ""
          echo "Uploading artifact..."

          az storage blob upload-batch \
            --account-name "$(storageAccount)" \
            --destination "$(containerName)" \
            --source "$(Build.ArtifactStagingDirectory)/$(artifactName)" \
            --auth-mode login \
            --overwrite true

          echo ""
          echo "Artifact uploaded successfully."


    # --------------------------------------------------------
    # VERIFY AZURE STORAGE
    # --------------------------------------------------------

    - task: AzureCLI@2
      displayName: 'Verify Artifact in Azure Storage'

      inputs:

        azureSubscription: '$(azureServiceConnection)'

        scriptType: 'bash'

        scriptLocation: 'inlineScript'

        inlineScript: |
          set -e

          echo "========================================"
          echo "FILES IN AZURE STORAGE"
          echo "========================================"

          az storage blob list \
            --account-name "$(storageAccount)" \
            --container-name "$(containerName)" \
            --auth-mode login \
            --query "[].{Name:name,Size:properties.contentLength}" \
            --output table

          echo ""
          echo "Storage verification completed."
