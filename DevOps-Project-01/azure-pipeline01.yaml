trigger:
  branches:
    include:
      - master

pr: none

# ============================================================
# SELF-HOSTED MAC AGENT
# ============================================================

pool:
  name: 'Pv-agent'


# ============================================================
# VARIABLES
# ============================================================

variables:

  # Java
  javaVersion: '21'

  # Application
  appDirectory: 'DevOps-Project-01/Java-Login-App'

  # Azure Storage
  storageAccount: 'pvstrg199'
  containerName: 'pv-container'

  # Artifact
  artifactName: 'java-login-app'

  # Azure service connection
  azureServiceConnection: 'b13'


# ============================================================
# STAGES
# ============================================================

stages:

# ============================================================
# STAGE 1 - BUILD
# ============================================================

- stage: Build
  displayName: 'Build Java Login Application'

  jobs:

  - job: MavenBuild
    displayName: 'Maven Build'

    steps:

    # --------------------------------------------------------
    # CHECKOUT
    # --------------------------------------------------------

    - checkout: self
      displayName: 'Checkout source code'


    # --------------------------------------------------------
    # VERIFY AGENT
    # --------------------------------------------------------

    - bash: |
        echo "========================================"
        echo "AGENT INFORMATION"
        echo "========================================"

        echo "Agent Name    : $AGENT_NAME"
        echo "Agent OS      : $AGENT_OS"
        echo "Agent Version : $AGENT_VERSION"
        echo "Computer      : $(hostname)"
        echo "User          : $(whoami)"

      displayName: 'Verify Mac Agent'


    # --------------------------------------------------------
    # VERIFY JAVA
    # --------------------------------------------------------

    - bash: |
        echo "========================================"
        echo "JAVA VERSION"
        echo "========================================"

        java -version

        if [ $? -ne 0 ]; then
          echo "Java is not available."
          exit 1
        fi

        echo ""
        echo "JAVA_HOME:"
        echo "$JAVA_HOME"

      displayName: 'Verify Java'


    # --------------------------------------------------------
    # VERIFY MAVEN
    # --------------------------------------------------------

    - bash: |
        echo "========================================"
        echo "MAVEN VERSION"
        echo "========================================"

        which mvn

        echo ""

        mvn -version

        if [ $? -ne 0 ]; then
          echo "Maven is not available to the Azure DevOps agent."
          exit 1
        fi

      displayName: 'Verify Maven'


    # --------------------------------------------------------
    # VERIFY APPLICATION DIRECTORY
    # --------------------------------------------------------

    - bash: |
        echo "========================================"
        echo "VERIFY APPLICATION"
        echo "========================================"

        APP_PATH="$(Build.SourcesDirectory)/$(appDirectory)"

        echo "Application path:"
        echo "$APP_PATH"

        if [ ! -d "$APP_PATH" ]; then
          echo "ERROR: Application directory does not exist."

          echo ""
          echo "Repository contents:"
          find "$(Build.SourcesDirectory)" -maxdepth 3 -type d

          exit 1
        fi

        echo ""
        echo "Application directory exists."

        echo ""
        echo "Application contents:"
        ls -la "$APP_PATH"

        echo ""
        echo "Checking pom.xml:"

        if [ ! -f "$APP_PATH/pom.xml" ]; then
          echo "ERROR: pom.xml not found."
          exit 1
        fi

        echo "pom.xml found successfully."

      displayName: 'Verify Application'


    # --------------------------------------------------------
    # MAVEN BUILD
    # --------------------------------------------------------

    - bash: |
        echo "========================================"
        echo "MAVEN BUILD"
        echo "========================================"

        cd "$(Build.SourcesDirectory)/$(appDirectory)"

        echo "Current directory:"
        pwd

        echo ""
        echo "Running Maven build..."

        mvn clean package -DskipTests -e

        MAVEN_EXIT=$?

        echo ""
        echo "Maven exit code: $MAVEN_EXIT"

        exit $MAVEN_EXIT

      displayName: 'Maven clean package'
