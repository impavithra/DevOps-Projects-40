trigger:
  branches:
    include:
      - master

pr: none

pool:
  name: 'Pv-agent'

variables:
  appDirectory: 'DevOps-Project-01/Java-Login-App'
  storageAccount: 'pvstrg199'
  containerName: 'pv-container'
  artifactName: 'java-login-app'
  azureServiceConnection: 'b13'

stages:

# ============================================================
# STAGE 1 - BUILD
# ============================================================

- stage: Build
  displayName: 'Build Java Login Application'

  jobs:
  - job: MavenBuild
    displayName: 'Maven Build'

    steps:

    - checkout: self
      displayName: 'Checkout source code'

    # --------------------------------------------------------
    # VERIFY JAVA, MAVEN AND PROJECT PATH
    # --------------------------------------------------------

    - bash: |
        echo "========================================"
        echo "JAVA VERSION"
        echo "========================================"
        java -version

        echo ""
        echo "========================================"
        echo "MAVEN VERSION"
        echo "========================================"
        mvn -version

        echo ""
        echo "========================================"
        echo "PROJECT DIRECTORY"
        echo "========================================"

        echo "$(Build.SourcesDirectory)/$(appDirectory)"

        ls -la "$(Build.SourcesDirectory)/$(appDirectory)"

        echo ""
        echo "Checking pom.xml"

        ls -l "$(Build.SourcesDirectory)/$(appDirectory)/pom.xml"

      displayName: 'Verify Java Maven and project'


    # --------------------------------------------------------
    # MAVEN BUILD
    # --------------------------------------------------------

    - bash: |
        echo "========================================"
        echo "BUILDING APPLICATION"
        echo "========================================"

        cd "$(Build.SourcesDirectory)/$(appDirectory)"

        echo "Current directory:"
        pwd

        echo ""
        echo "Project files:"
        ls -la

        echo ""
        echo "Starting Maven build..."

        mvn clean package -DskipTests -e

        MAVEN_EXIT=$?

        echo ""
        echo "========================================"
        echo "MAVEN EXIT CODE: $MAVEN_EXIT"
        echo "========================================"

        exit $MAVEN_EXIT

      displayName: 'Maven clean package'


    # --------------------------------------------------------
    # VERIFY BUILD OUTPUT
    # --------------------------------------------------------

    - bash: |
        echo "========================================"
        echo "VERIFY BUILD OUTPUT"
        echo "========================================"

        cd "$(Build.SourcesDirectory)/$(appDirectory)"

        if [ ! -d "target" ]; then
          echo "ERROR: target directory was not created."
          exit 1
        fi

        echo ""
        echo "Target directory contents:"

        ls -lah target

        echo ""
        echo "Generated JAR/WAR files:"

        find target -maxdepth 1 \
          \( -name "*.jar" -o -name "*.war" \) \
          -type f \
          -print

      displayName: 'Verify generated artifact'


    # --------------------------------------------------------
    # PREPARE ARTIFACT
    # --------------------------------------------------------

    - bash: |
        set -e

        echo "========================================"
        echo "PREPARING ARTIFACT"
        echo "========================================"

        ARTIFACT_DIR="$(Build.ArtifactStagingDirectory)/$(artifactName)"

        mkdir -p "$ARTIFACT_DIR"

        cd "$(Build.SourcesDirectory)/$(appDirectory)"

        FILE_COUNT=$(find target -maxdepth 1 \
          \( -name "*.jar" -o -name "*.war" \) \
          -type f | wc -l | tr -d ' ')

        echo "Artifact count: $FILE_COUNT"

        if [ "$FILE_COUNT" -eq 0 ]; then
          echo "ERROR: No JAR or WAR file generated."
          exit 1
        fi

        find target -maxdepth 1 \
          \( -name "*.jar" -o -name "*.war" \) \
          -type f \
          -exec cp {} "$ARTIFACT_DIR/" \;

        echo ""
        echo "Copied artifacts:"

        ls -lah "$ARTIFACT_DIR"

      displayName: 'Prepare artifact'


    # --------------------------------------------------------
    # PUBLISH PIPELINE ARTIFACT
    # --------------------------------------------------------

    - task: PublishPipelineArtifact@1
      displayName: 'Publish pipeline artifact'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/$(artifactName)'
        artifact: '$(artifactName)'


# ============================================================
# STAGE 2 - UPLOAD TO AZURE STORAGE
# ============================================================

- stage: Upload
  displayName: 'Upload Artifact to Azure Storage'

  dependsOn: Build
  condition: succeeded()

  jobs:
  - job: UploadArtifact
    displayName: 'Upload to Azure Blob Storage'

    steps:

    # --------------------------------------------------------
    # DOWNLOAD ARTIFACT
    # --------------------------------------------------------

    - task: DownloadPipelineArtifact@2
      displayName: 'Download pipeline artifact'
      inputs:
        artifact: '$(artifactName)'
        path: '$(Pipeline.Workspace)/$(artifactName)'


    # --------------------------------------------------------
    # VERIFY DOWNLOADED FILE
    # --------------------------------------------------------

    - bash: |
        echo "========================================"
        echo "DOWNLOADED ARTIFACT"
        echo "========================================"

        ls -lah "$(Pipeline.Workspace)/$(artifactName)"

      displayName: 'Verify downloaded artifact'


    # --------------------------------------------------------
    # UPLOAD TO AZURE STORAGE
    # --------------------------------------------------------

    - task: AzureCLI@2
      displayName: 'Upload artifact to Azure Blob Storage'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          set -e

          echo "========================================"
          echo "AZURE LOGIN"
          echo "========================================"

          az account show --output table

          echo ""
          echo "Storage account: $(storageAccount)"
          echo "Container: $(containerName)"

          echo ""
          echo "Files to upload:"

          ls -lah "$(Pipeline.Workspace)/$(artifactName)"

          echo ""
          echo "Uploading..."

          az storage blob upload-batch \
            --account-name "$(storageAccount)" \
            --destination "$(containerName)" \
            --source "$(Pipeline.Workspace)/$(artifactName)" \
            --auth-mode login \
            --overwrite true

          echo ""
          echo "UPLOAD COMPLETED"


    # --------------------------------------------------------
    # VERIFY AZURE BLOB
    # --------------------------------------------------------

    - task: AzureCLI@2
      displayName: 'Verify blob upload'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          echo "========================================"
          echo "FILES IN AZURE CONTAINER"
          echo "========================================"

          az storage blob list \
            --account-name "$(storageAccount)" \
            --container-name "$(containerName)" \
            --auth-mode login \
            --output table