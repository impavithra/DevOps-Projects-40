trigger:
  branches:
    include:
      - master

pr: none

pool:
  name: 'Pv-agent'

variables:
  appDirectory: 'DevOps-Project-01/Java-Login-App'
  storageAccount: 'pvstrg199'
  containerName: 'pv-container'
  artifactName: 'java-login-app'
  azureServiceConnection: 'b13'

stages:

- stage: Build
  displayName: 'Build Java Login Application'

  jobs:
  - job: MavenBuild
    displayName: 'Maven Build'

    steps:

    - checkout: self
      displayName: 'Checkout source code'

    - bash: |
        echo "JAVA VERSION"
        java -version

        echo "MAVEN VERSION"
        mvn -version

        echo "PROJECT DIRECTORY"
        ls -la "$(Build.SourcesDirectory)/$(appDirectory)"
      displayName: 'Verify Java and Maven'

    - bash: |
        set -e

        cd "$(Build.SourcesDirectory)/$(appDirectory)"

        echo "Current directory:"
        pwd

        echo "Running Maven build..."
        mvn clean package -DskipTests
      displayName: 'Maven clean package'

    - bash: |
        set -e

        cd "$(Build.SourcesDirectory)/$(appDirectory)"

        echo "BUILD OUTPUT"

        if [ ! -d "target" ]; then
          echo "Target directory not found"
          exit 1
        fi

        ls -lh target

        echo "Generated JAR/WAR files:"

        find target -maxdepth 1 \
          \( -name "*.jar" -o -name "*.war" \) \
          -type f \
          -print
      displayName: 'Verify generated artifact'

    - bash: |
        set -e

        ARTIFACT_DIR="$(Build.ArtifactStagingDirectory)/$(artifactName)"

        mkdir -p "$ARTIFACT_DIR"

        cd "$(Build.SourcesDirectory)/$(appDirectory)"

        FILE_COUNT=$(find target -maxdepth 1 \
          \( -name "*.jar" -o -name "*.war" \) \
          -type f | wc -l)

        if [ "$FILE_COUNT" -eq 0 ]; then
          echo "No JAR or WAR file generated"
          exit 1
        fi

        find target -maxdepth 1 \
          \( -name "*.jar" -o -name "*.war" \) \
          -type f \
          -exec cp {} "$ARTIFACT_DIR/" \;

        echo "Artifacts copied:"
        ls -lh "$ARTIFACT_DIR"
      displayName: 'Prepare artifact'

    - task: PublishPipelineArtifact@1
      displayName: 'Publish pipeline artifact'
      inputs:
        targetPath: '$(Build.ArtifactStagingDirectory)/$(artifactName)'
        artifact: '$(artifactName)'


- stage: Upload
  displayName: 'Upload Artifact to Azure Storage'
  dependsOn: Build
  condition: succeeded()

  jobs:
  - job: UploadArtifact
    displayName: 'Upload to Azure Blob Storage'

    steps:

    - task: DownloadPipelineArtifact@2
      displayName: 'Download pipeline artifact'
      inputs:
        artifact: '$(artifactName)'
        path: '$(Pipeline.Workspace)/$(artifactName)'

    - bash: |
        echo "DOWNLOADED ARTIFACT"
        ls -lh "$(Pipeline.Workspace)/$(artifactName)"
      displayName: 'Verify downloaded artifact'

    - task: AzureCLI@2
      displayName: 'Upload artifact to Azure Blob Storage'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          set -e

          echo "Storage Account: $(storageAccount)"
          echo "Container: $(containerName)"

          ls -lh "$(Pipeline.Workspace)/$(artifactName)"

          az storage blob upload-batch \
            --account-name "$(storageAccount)" \
            --destination "$(containerName)" \
            --source "$(Pipeline.Workspace)/$(artifactName)" \
            --auth-mode login \
            --overwrite true

          echo "Upload successful"

    - task: AzureCLI@2
      displayName: 'Verify blob upload'
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        inlineScript: |
          az storage blob list \
            --account-name "$(storageAccount)" \
            --container-name "$(containerName)" \
            --auth-mode login \
            --output table